{% extends "base.html" %}

{% block title %}Table Not Set Up{% endblock %}
{% block body_class %}page-error{% endblock %}

{% block content %}
<main class="error-screen">
  <div class="ticket ticket--error">
    <p class="error-screen__eyebrow">Not Ready Yet</p>
    <h1 class="error-screen__heading">{{ message }}</h1>
    <p class="error-screen__hint">
      A member of staff needs to open this tablet's table link once before
      customers can order from it.
    </p>
  </div>
</main>
{% endblock %}
